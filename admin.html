<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Krispy Leafs Admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:1.5rem auto;padding:0 1rem;background:#f6f1e7;color:#111}
input,select,button{font:inherit;padding:.65rem .8rem;margin:.2rem 0}
input,select{border:1px solid #bbb;width:100%;background:#fff}
button{background:#ff4a2b;color:#fff;border:0;cursor:pointer;font-weight:700}button.d{background:#111}
label{display:block;font-size:.85rem;font-weight:600;margin-top:.5rem}
.box{background:#fff;padding:1rem;margin:1rem 0}
.row{display:grid;grid-template-columns:70px 1fr;gap:.5rem .75rem;border-top:1px solid #eee;padding:.85rem 0}
.row img{width:70px;height:88px;object-fit:cover;grid-row:span 2}
.row .name{font-weight:700;align-self:center}
.row .fields{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;grid-column:2}
.row .fields select{width:auto;flex:1 1 130px}
.row .fields input.type{width:auto;flex:1 1 130px}
.row .fields input.price{width:90px}
h4{margin:1rem 0 .1rem;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
#msg{background:#dff5e6;padding:.6rem;display:none}#msg.err{background:#fde0dc}.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div id="login" hidden>
  <h1>Admin login</h1><p id="lmsg"></p>
  <form class="box" id="lf">
    <input id="u" placeholder="Username" autocomplete="username" required>
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Log in</button>
  </form>
</div>
<div id="dash" hidden>
  <div class="top"><h1>Merchandise</h1><button class="d" id="out">Log out</button></div>
  <p id="msg"></p>
  <form class="box" id="af"><h3>Add item</h3>
    <input id="n" placeholder="Item name" maxlength="80" required>
    <label for="sec">Which section of the site?</label>
    <select id="sec" required>
      <option value="mens">Men's</option>
      <option value="womens">Women's</option>
      <option value="kids">Kids</option>
      <option value="hats">Hats</option>
      <option value="accessories">Accessories</option>
      <option value="more">Other (general shop)</option>
    </select>
    <label for="cat">Type (optional)</label>
    <input id="cat" placeholder="e.g. Tees, Hoodies, Beanies" maxlength="40" list="cats">
    <datalist id="cats"></datalist>
    <input id="pr" type="number" step="0.01" min="0" placeholder="Price (USD)" required>
    <input id="ph" type="file" accept="image/*" required>
    <button id="ab">Upload</button>
  </form>
  <div class="box"><h3>Items</h3><div id="items"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const call = (path, opts = {}) => fetch('/api/admin/' + path, { credentials: 'same-origin', ...opts });
function say(t, err) { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; m.style.display = 'block'; }

const SECTIONS = [
  ['mens', "Men's"], ['womens', "Women's"], ['kids', 'Kids'],
  ['hats', 'Hats'], ['accessories', 'Accessories'], ['more', 'Other (general shop)']
];
// items added before sections existed: guess the section from the category text
function sectionOf(p) {
  if (SECTIONS.some(s => s[0] === p.section)) return p.section;
  const c = (p.category || '').toLowerCase();
  if (/\bkids?\b|youth|toddler/.test(c)) return 'kids';
  if (/wom[ae]n/.test(c)) return 'womens';
  if (/\bmen'?s?\b/.test(c)) return 'mens';
  if (/\bhats?\b|\bcaps?\b|beanie/.test(c)) return 'hats';
  if (/accessor|sticker|\bbags?\b|\bpins?\b|patch|lighter|tray|grinder/.test(c)) return 'accessories';
  return 'more';
}
const typeOf = p => (p.category && p.category !== 'Uncategorized') ? p.category : '';

async function toJpeg(file) {               // shrink to max 1400px JPEG before upload
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k)); return e;
}
function sectionSelect(value) {
  const sel = el('select');
  SECTIONS.forEach(([v, label]) => sel.append(el('option', { value: v, textContent: label, selected: v === value })));
  return sel;
}

async function render() {
  const items = await (await fetch('/api/products')).json();
  const box = $('#items'); box.replaceChildren();
  $('#cats').replaceChildren(...[...new Set(items.map(typeOf).filter(Boolean))].map(c => el('option', { value: c })));
  if (!items.length) { box.append(el('p', { textContent: 'No items yet.' })); return; }
  SECTIONS.forEach(([key, label]) => {
    const list = items.filter(p => sectionOf(p) === key);
    if (!list.length) return;
    box.append(el('h4', { textContent: label }));
    list.forEach(p => {
      const sec = sectionSelect(sectionOf(p));
      const type = el('input', { className: 'type', placeholder: 'Type (optional)', value: typeOf(p), maxLength: 40 });
      const price = el('input', { className: 'price', type: 'number', step: '0.01', min: '0', value: Number(p.price).toFixed(2) });
      const save = el('button', { textContent: 'Save', onclick: async () => {
        const r = await call('products/' + p.id, {
          method: 'PATCH', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ price: price.value, section: sec.value, category: type.value })
        });
        say(r.ok ? 'Saved.' : 'Could not save. Check the price.', !r.ok);
        if (r.ok) render();
      }});
      const del = el('button', { className: 'd', textContent: 'Delete', onclick: async () => {
        if (!confirm('Delete this item?')) return;
        await call('products/' + p.id, { method: 'DELETE' }); say('Item deleted.'); render();
      }});
      box.append(el('div', { className: 'row' },
        el('img', { src: p.image, alt: '' }),
        el('div', { className: 'name', textContent: p.name }),
        el('div', { className: 'fields' }, sec, type, el('span', { textContent: '$' }), price, save, del)));
    });
  });
}
async function show() {
  const ok = (await call('me')).ok;
  $('#login').hidden = ok; $('#dash').hidden = !ok;
  if (ok) render();
}
$('#lf').onsubmit = async e => {
  e.preventDefault();
  const r = await call('login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('#u').value, password: $('#p').value }) });
  if (r.ok) { $('#p').value = ''; show(); } else $('#lmsg').textContent = (await r.json()).error;
};
$('#out').onclick = async () => { await call('logout', { method: 'POST' }); show(); };
$('#af').onsubmit = async e => {
  e.preventDefault(); $('#ab').disabled = true;
  try {
    const fd = new FormData();
    fd.append('name', $('#n').value); fd.append('section', $('#sec').value);
    fd.append('category', $('#cat').value); fd.append('price', $('#pr').value);
    fd.append('photo', await toJpeg($('#ph').files[0]), 'photo.jpg');
    const r = await call('products', { method: 'POST', body: fd });
    if (r.ok) { say('Item added.'); e.target.reset(); render(); } else say((await r.json()).error, true);
  } catch { say('Could not read that image. Try a JPEG or PNG.', true); }
  $('#ab').disabled = false;
};
show();
</script></body></html>
